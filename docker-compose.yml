# =============================================================================
# aify-comms - Docker Compose
# =============================================================================
# Override ports, resources, etc. in docker-compose.override.yml
# The service is the stateful dashboard/API container. Host-side bridges run
# outside Docker on the machines that should execute Codex/Claude/OpenCode.

services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PORT: ${SERVICE_PORT:-8800}
    container_name: ${COMPOSE_PROJECT_NAME:-aify-comms}-service
    restart: ${RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${SERVICE_PORT:-8800}:8800"
    volumes:
      - service-data:/data
      - ./config:/app/config:ro
      # Mount Claude Code auth from host — enables trigger/dispatch inside container
      # Uses your Max subscription, no API key needed
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/service/.claude:ro
      # Codex/hermes auth, READ-ONLY — lets the SERVICE collect OpenAI quota itself instead of
      # depending on the environment bridge. The collector used to live only in the bridge, so
      # every quota fix meant restarting it — which cycles the operator's managed agents
      # ("I cannot restart the team after every 5 minutes"). Quota is a file read plus one HTTP
      # GET; it has no business costing an agent restart. Read-only: we only ever read a token.
      - ${CODEX_CONFIG_DIR:-~/.codex}:/home/service/.codex:ro
      - ${HERMES_CONFIG_DIR:-~/.hermes}:/home/service/.hermes:ro
    env_file:
      - .env
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-8800}
      - DATA_DIR=/data
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-4g}
    networks:
      - service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVICE_PORT:-8800}/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  new-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PORT: ${SERVICE_PORT:-8800}
    container_name: ${COMPOSE_PROJECT_NAME:-aify-comms}-dashboard-next
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["python", "-m", "uvicorn", "service.new_dashboard_app:app", "--host", "0.0.0.0", "--port", "8801", "--no-access-log"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${NEW_DASHBOARD_PORT:-8801}:8801"
    depends_on:
      - service
    env_file:
      - .env
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-8800}
      - DATA_DIR=/data
    deploy:
      resources:
        limits:
          cpus: "${NEW_DASHBOARD_CPU_LIMIT:-1}"
          memory: ${NEW_DASHBOARD_MEMORY_LIMIT:-1g}
    networks:
      - service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # OPT-IN HTTPS. Only starts with `docker compose --profile https up -d`; a plain
  # `docker compose up -d` never sees it, so the default deployment is unchanged.
  #
  # Exists for ONE reason: browser notifications need a secure context. `localhost` already is one,
  # but reaching the dashboard over the LAN or from a phone is not, and the browser then refuses to
  # let you enable notifications at all. Caddy terminates TLS with a locally-managed CA and proxies
  # the dashboard, the API and the WebSocket through a SINGLE origin — necessary, not cosmetic,
  # because an https page cannot talk to a ws:// socket or an http:// API (mixed content).
  https-proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    container_name: ${COMPOSE_PROJECT_NAME:-aify-comms}-https
    restart: ${RESTART_POLICY:-unless-stopped}
    # HOST AND CONTAINER PORT ARE THE SAME ON PURPOSE. Caddy listens on whatever port its SITE
    # ADDRESSES name, not on a fixed one -- so publishing `8801:8443` while HTTPS_SITES says `:8801`
    # maps a host port onto a container port nothing is listening on, and the failure is a connection
    # refused with every container reporting healthy. Keep HTTPS_PORT and the port inside HTTPS_SITES
    # equal.
    ports:
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    # HTTPS_SITES REACHES CADDY ONLY IF IT IS PASSED HERE. `{$HTTPS_SITES:...}` in the Caddyfile is
    # resolved by Caddy from its OWN environment, not by compose, and this service has no `env_file`
    # -- so the knob documented in `.env.example` silently did nothing and Caddy always used the
    # Caddyfile default. Measured 2026-09-02: `printenv HTTPS_SITES` in the container was empty
    # while `.env` had named four sites, and the certificates Caddy issued were the default four.
    # Adding a name to `.env` and seeing no change is the whole failure this line removes.
    environment:
      - HTTPS_SITES=${HTTPS_SITES:-localhost:8443, 127.0.0.1:8443}
      - HTTPS_DEFAULT_SNI=${HTTPS_DEFAULT_SNI:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisted so the local CA and issued certs survive a restart. Without this every
      # `up` mints a NEW CA and every device has to trust it again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - service
      - new-dashboard
    networks:
      - service-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  service-data:
    name: ${DATA_VOLUME_NAME:-aify-comms-data}
    # KEEP THIS ON `service-data`. With DATA_VOLUME_EXTERNAL=true the database volume is managed
    # outside compose, which is what stops `docker compose down -v` from deleting it. An edit that
    # inserted the caddy volumes above briefly detached this line and left it on caddy-config —
    # caught because caddy then failed to start looking for an external volume that did not exist.
    # The louder failure was the silent one: service-data would have become compose-managed and
    # `down -v` would have destroyed the operator's database.
    external: ${DATA_VOLUME_EXTERNAL:-false}
  # Caddy's local CA and issued certs. NOT external: these are disposable and regenerating them
  # only costs re-trusting the CA on each device.
  caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-aify-comms}-caddy-data
  caddy-config:
    name: ${COMPOSE_PROJECT_NAME:-aify-comms}-caddy-config

networks:
  service-network:
    name: ${COMPOSE_PROJECT_NAME:-aify-comms}-network
    driver: bridge
